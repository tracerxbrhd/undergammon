name: undergammon-test
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: undergammon_test
      POSTGRES_USER: undergammon_test
      POSTGRES_PASSWORD: local_test_only
    ports: ['127.0.0.1:55432:5432']
    tmpfs: ['/var/lib/postgresql']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U undergammon_test']
      interval: 2s
      retries: 30
