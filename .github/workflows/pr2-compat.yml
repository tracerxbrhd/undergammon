name: Apply PR 2 rollout compatibility
on:
  push:
    branches: [feat/pr-2-checker-set-cosmetics]
    paths: [.github/workflows/pr2-compat.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr-2-checker-set-cosmetics
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: python3 .github/scripts/pr2_compat.py
      - run: >-
          pnpm exec prettier --write
          apps/server/src/app.ts
          apps/server/src/cosmetics.ts
          apps/miniapp/src/Store.tsx
          apps/server/test/integration.test.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps
          git diff --cached --check
          git commit -m "fix(cosmetics): preserve legacy Store rollout compatibility"
          git push
