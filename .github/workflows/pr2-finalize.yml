name: Finalize PR 2
on:
  push:
    branches: [feat/pr-2-checker-set-cosmetics]
    paths: [.github/workflows/pr2-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr-2-checker-set-cosmetics
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: python3 .github/scripts/pr2_finalize.py
      - run: >-
          pnpm exec prettier --write
          tests/browser/game.spec.ts
          apps/server/src/cosmetics.ts
          docs/product/10-economy-and-cosmetics.md
          docs/product/22-board-scene-cosmetics-architecture.md
          IMPLEMENTATION_STATUS.md
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests apps/server/src/cosmetics.ts docs IMPLEMENTATION_STATUS.md
          git diff --cached --check
          git commit -m "fix(cosmetics): harden PR 2 flows and docs"
          git push
